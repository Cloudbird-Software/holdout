name: validate
# W1-C4（ADR-0056）：条目封存完整性校验——schema 合规（IFACE-07）/ sealed_sha256
# 锚定 / index 一致 / canary registry 双向一致。PR+push 全跑；weekly cron 对 main
# 做周期自检（已封存条目被改动而哈希未重算 = 试卷层完整性漂移，必须红）。
# 注意：本 workflow 日志在 canary sweep 的扫描范围内——校验器输出已掩码 marker。
on:
  merge_group:
    # ADR-0042：merge queue 必需订阅
    types: [checks_requested]
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 4 * * 5" # 每周五 04:43 UTC（错峰：避开 .github 仓周一 drift/sweep 峰）
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    # CI-4（enforced）：zizmor 工作流安全审计 + 大文件/密钥样文件巡检——可复用
    # 工作流统一实现（canary marker 为自定义格式，不命中 gitleaks 规则）
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/hygiene.yml@61191f87c537f6e887695517121c6e530a838261 # v1
    permissions:
      contents: read

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install jsonschema pyyaml
      - name: 条目封存完整性校验
        run: python3 scripts/validate_entries.py

  # W4-C3（.github#222 / ADR-0068）：seal/unseal-log 自测——封存哈希公式红/绿、append-only
  # 台账（两行且首行不变）、改历史断链红；fixture 临时目录，不触真实试卷。系统 python+pyyaml。
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 封存/台账脚本自测（W4-C3）
        run: |
          pip install pyyaml
          python3 -m unittest discover -s scripts/tests -v

  gate:
    # 严格聚合器（ADR-0032 语义：skipped≠success，仅全 success 放行）——产出
    # org ruleset main-protection 的 required check "gate" 上下文。此前本仓无
    # gate job：required check 永不满足，PR 合并只能走 admin bypass（= §8 直推
    # 漂移源）——治理对齐跟修（P0）
    if: always()
    needs: [validate, selftest, hygiene]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: All required jobs green?
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          OK=$(echo "$NEEDS" | jq -r 'to_entries | all(.value.result == "success")')
          if [[ "$OK" != "true" ]]; then
            echo "::error::gate 上游未全绿（skipped≠success：严格断言——ADR-0032）"; exit 1
          fi
